# Udržuje Supabase projekt aktivní. Bezplatný Supabase uspí projekt po 7 dnech
# bez provozu, proto sem každé 3 dny pošleme drobný dotaz.
#
# GitHub zase vypne naplánované úlohy v repozitáři, kde 60 dní nikdo nic nezměnil.
# Proto úloha jednou za ~50 dní zapíše datum do souboru .keepalive.
name: Keepalive

on:
  schedule:
    - cron: "17 6 */3 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Dotaz do Supabase
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://encicvbzmsvmxgjmytmx.supabase.co/rest/v1/rpc/login?p_email=keepalive" \
            -H "apikey: sb_publishable_0q9P3ZygS4KdRVKkvNZ7oA_N_r7Mg1J")
          echo "Supabase odpověděl: $code"
          test "$code" = "200"

      - uses: actions/checkout@v4

      - name: Udržet repozitář aktivní
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 50 * 86400 )) ]; then
            date -u +%F > .keepalive
            git config user.name "keepalive-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .keepalive
            git commit -m "keepalive"
            git push
          fi
